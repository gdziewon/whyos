[workspace]
members = [
    "whyos",
    "whyos_demo",
    "whyos_shell"
]
resolver = "2"

[profile.release]
opt-level = "s"      # optimize for size
lto = true           # link time optim
codegen-units = 1    # optimize across all crates
panic = "abort"      # disable stack unwinding
debug = true         # keep debug symbols