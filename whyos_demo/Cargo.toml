[package]
name = "whyos_demo"
version = "0.1.0"
edition = "2024"

[features]
shell = [
    "dep:whyos_shell",
    "dep:embedded-hal-nb",
    "dep:nb"
]

[dependencies]
whyos = { path = "../whyos" }

embedded-hal = "1.0.0"
rp235x-hal = { version = "0.4.0", features = [
  "binary-info", # include a static variable containing binary info
  "critical-section-impl", # critical section that is safe for multicore use
  "defmt", # implements defmt::Format for several types
  "rt"
]}

defmt = "1.0.1"
defmt-rtt = "1.1.0"

# Shell
whyos_shell = { path = "../whyos_shell", optional = true}
embedded-hal-nb = { version = "1.0.0", optional = true}
nb = { version = "1.1.0", optional = true}

[dev-dependencies]
cortex-m-semihosting = "0.5.0"

[lib]
name = "whyos_demo"
path = "src/lib.rs"
test = false
harness = false
doctest = false

[[bin]]
name = "whyos_app"
path = "src/main.rs"
test = false

[[test]]
name = "test_scheduler"
harness = false

[[test]]
name = "test_args"
harness = false

[[test]]
name = "test_lifecycle"
harness = false

[[test]]
name = "test_itc"
harness = false

[[test]]
name = "test_err_handling"
harness = false