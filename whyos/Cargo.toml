[package]
name = "whyos"
version = "0.1.0"
edition = "2024"

[features]
default = ["rp235x"]
rp235x = []

[dependencies]
critical-section = "1.2.0"
defmt = "1.0.1"

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = "0.11"
riscv-rt = "0.12"
